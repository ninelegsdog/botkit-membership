[project]
name = "botkit-membership"
version = "1.0.0"
description = "Telegram bot for paid membership communities"
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.20",
    "sentry-sdk>=2.0",
    "aiogram>=3.30",
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",
    "redis>=5.0",
    "aiohttp>=3.9",
    "botkit-core @ git+https://github.com/ninelegsdog/botkit-core@v0.4.4",
    "pydantic-settings>=2.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-xdist>=3",
    "ruff>=0.5",
    "mypy>=1.10",
    "aiohttp>=3.9",
    "requests>=2.31",
]
e2e = [
    "telethon>=1.34",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=70"
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "no_req: fully offline, no external HTTP/Telegram requests",
    "req: requires network and/or a real external service",
    "unit: isolated unit test",
    "integration: local component/integration test",
    "webhook: webhook endpoint test",
    "e2e: real Telegram E2E via MTProto",
    "serial: must not be parallelized via xdist",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["src"]
parallel = true
omit = ["tests/*", "scripts/*", "bot.py", "src/core/tgwebhook.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 64
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.coverage.xml]
output = "coverage.xml"
